<link rel="stylesheet" href="/ai_addons/pattern_prediction/static/pattern_prediction.css">

<div class="section">
    <div class="section-header">
        <label>Requirement</label>
        <div class="search-dropdown" id="pp-trace-dropdown">
            <input class="search" id="pp-trace-search" type="text" placeholder="Search Req…" autocomplete="off">
            <div class="search-list scrollbar" id="pp-trace-list"></div>
        </div>
        <button class="btn-light" id="pp-clear-trace-btn">X Clear</button>
        <button class="btn-light" id="pp-predict-pattern-btn" disabled>Predict Pattern</button>
        <button class="btn-light" id="pp-predict-pattern-all-btn">Predict All</button>


        <button class="btn-light" id="pp-open-settings-btn" title="Settings">
            <img src="/ai_addons/pattern_prediction/static/cog.svg" alt="Settings">
        </button>
    </div>

    <div class="section-body">
        <!-- CANVAS -->
        <div id="pp-canvas-wrap">
            <div id="pp-canvas">
                <svg id="pp-tree-svg"></svg>
            </div>

        <!-- LEGEND OVERLAY -->
            <div id="pp-legend">
                <div id="pp-leg-item"><div id="pp-leg-dot" style="background:#4a4a46"></div>Question</div>
                <div id="pp-leg-item"><div id="pp-leg-dot" style="background:var(--status-ok)"></div>Answer</div>
                <div id="pp-leg-item"><div id="pp-leg-dot" style="background:#2b6cb0"></div>Pattern</div>
                <div id="pp-leg-item"><div id="pp-leg-dot" style="background:var(--status-warn)"></div>Trace active</div>
            </div>
        </div>

        <!-- ZOOM CONTROLS -->
        <div id="pp-zoom-controls">
            <button class="btn" id="pp-zoom-in">+</button>
            <button class="btn" id="pp-zoom-reset">o</button>
            <button class="btn" id="pp-zoom-out">-</button>
        </div>

        <!-- MINIMAP -->
        <div id="pp-minimap">
            <svg id="pp-minimap-svg" width="160" height="100"></svg>
            <div id="pp-minimap-viewport"></div>
        </div>
    </div>
</div>



<!-- ---------- SETTINGS MODAL ----------- -->
<div id="pp-settings-overlay" class="settings-overlay" hidden>
  <div class="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">

    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button id="pp-close-settings-btn" class="settings-close" aria-label="Close">x</button>
    </div>

    <div class="settings-tabs" role="tablist">
      <button class="stab active" data-tab="model" role="tab" aria-selected="true">Model Select</button>
      <button class="stab"        data-tab="basic" role="tab" aria-selected="false">Basic Settings</button>
    </div>

    <!-- Tab: Model Select -->
    <div class="settings-panel" id="pp-stab-model">

      <!-- Model ensemble list -->
      <div class="settings-section-label">
        Model Ensemble
        <button id="pp-add-ensemble-entry-btn" class="btn-light" title="Add entry">+</button>
        <button id="pp-save-ensemble-entry-btn" class="btn-light" title="Save">Save</button>
      </div>

      <div id="pp-ensemble-list">
        <!-- entries injected by JS -->
      </div>

    </div>

    <!-- Tab: Basic Settings -->
    <div class="settings-panel" id="pp-stab-basic" hidden>
      <div class="settings-field">
        <label class="settings-label">TREE</label>
        <div id="pp-tree-dropdown">
            <input id="pp-tree-search" type="text" placeholder="Search Tree…" autocomplete="off">
        <div id="pp-tree-list"></div>
        </div>
        <label class="settings-label">Export</label>
        <button id="pp-download-svg-btn" class="settings-action-btn">⬇ Download SVG</button>
        <button id="pp-download-detailed-traces-btn" class="settings-action-btn">⬇ Download Detailed Traces</button>
      </div>
    </div>

  </div>
</div>
